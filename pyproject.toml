[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-performance-intelligence-engine"
version = "0.1.0"
description = "Loan Performance Intelligence Engine for Intain Campus FinTech Challenge 2026 AI Track"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py312']
